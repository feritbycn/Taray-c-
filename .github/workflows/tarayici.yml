name: APK derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Dosyayı adlandır
        run: |
          V=$(tr -d '[:space:]' < VERSION)
          mkdir -p cikti
          cp app/build/outputs/apk/release/app-release.apk "cikti/Turkuaz-$V.apk"

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: Turkuaz-APK
          path: cikti/*.apk
